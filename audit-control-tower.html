<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbon Audit Control Tower — GHG Protocol Scope 3</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f172a;
  --surface:   #1e293b;
  --border:    #334155;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --sub:       #94a3b8;
  --green:     #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --amber:     #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --red:       #ef4444;
  --red-dim:   rgba(239,68,68,0.10);
  --blue:      #60a5fa;
  --teal:      #34d399;
  --purple:    #a78bfa;
}

body {
  font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── HEADER ─────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 16px;
}

.logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #10b981, #059669);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
}
.logo-name { font-size: 13px; font-weight: 700; color: #f1f5f9; }
.logo-sub  { font-size: 9px; color: var(--muted); margin-top: 1px; letter-spacing: 0.3px; }

.stats-bar { display: flex; gap: 8px; }
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  min-width: 120px;
}
.stat-label { font-size: 8.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
.stat-main  { display: flex; align-items: baseline; gap: 4px; }
.stat-value { font-size: 19px; font-weight: 700; color: var(--green); line-height: 1.1; }
.stat-value.blue   { color: var(--blue); }
.stat-value.teal   { color: var(--teal); }
.stat-unit  { font-size: 9px; color: var(--muted); }
.stat-sub   { font-size: 9px; color: var(--sub); margin-top: 1px; }

/* ── FILTER BAR ─────────────────────────────────────────────────────── */
.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.filter-bar select,
.filter-bar input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 11px;
  outline: none;
  height: 28px;
}
.filter-bar select:focus,
.filter-bar input:focus { border-color: var(--green); }
.filter-bar input { width: 180px; }
.filter-bar input::placeholder { color: var(--muted); }

.filter-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

.count-label {
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
  white-space: nowrap;
}
.count-label strong { color: var(--green); }

.btn-reset {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
  font-size: 10px;
  padding: 4px 10px;
  height: 28px;
  transition: all 0.15s;
}
.btn-reset:hover { border-color: var(--sub); color: var(--sub); }

/* ── MAIN LAYOUT ─────────────────────────────────────────────────────── */
main { display: flex; flex: 1; overflow: hidden; }

/* ── LEFT PANEL (table) ─────────────────────────────────────────────── */
.left-panel {
  width: 510px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.table-wrapper { overflow-y: auto; flex: 1; }
.table-wrapper::-webkit-scrollbar { width: 5px; }
.table-wrapper::-webkit-scrollbar-track { background: var(--bg); }
.table-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

table { width: 100%; border-collapse: collapse; }

thead { position: sticky; top: 0; z-index: 10; }
th {
  background: var(--bg);
  color: var(--muted);
  font-weight: 500;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  padding: 7px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tr.trip-row {
  border-bottom: 1px solid rgba(51,65,85,0.5);
  cursor: pointer;
  transition: background 0.1s;
  border-left: 3px solid transparent;
}
tr.trip-row:hover  { background: rgba(30,41,59,0.8); }
tr.trip-row.active { background: rgba(30,58,95,0.8); border-left-color: var(--green); }
tr.trip-row.warn   { border-left-color: var(--amber); }
tr.trip-row.error  { border-left-color: var(--red); }

td {
  padding: 8px 12px;
  vertical-align: middle;
}

.cell-id   { font-family: 'Menlo', 'SF Mono', monospace; font-size: 10px; color: var(--sub); }
.cell-date { font-size: 9px; color: var(--muted); margin-top: 3px; }

.vbadge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-top: 3px;
}
.vbadge-large   { background: rgba(59,130,246,0.12); color: var(--blue);   border: 1px solid rgba(59,130,246,0.3); }
.vbadge-medium  { background: rgba(16,185,129,0.10); color: var(--teal);   border: 1px solid rgba(16,185,129,0.3); }
.vbadge-small   { background: rgba(167,139,250,0.10);color: var(--purple); border: 1px solid rgba(167,139,250,0.3);}
.vbadge-unknown { background: rgba(100,116,139,0.10);color: var(--muted);  border: 1px solid var(--border); }

.qbadge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 8px;
  font-weight: 600;
  margin-top: 3px;
}
.qbadge-warn  { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.qbadge-error { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }

.route-from { font-size: 11.5px; font-weight: 600; color: var(--text); }
.route-arr  { font-size: 9px; color: var(--muted); margin: 2px 0; }
.route-to   { font-size: 11px; color: var(--sub); }

.dist-km     { font-size: 11.5px; color: var(--sub); }
.dist-weight { font-size: 9px; color: var(--muted); margin-top: 2px; }

.co2-val  { font-size: 14px; font-weight: 700; color: var(--green); line-height: 1.1; }
.co2-null { font-size: 13px; color: var(--muted); }
.co2-unit { font-size: 8.5px; color: var(--muted); }
.co2-bar-wrap { height: 3px; background: rgba(51,65,85,0.6); border-radius: 2px; margin-top: 5px; width: 80px; }
.co2-bar      { height: 3px; background: var(--green); border-radius: 2px; }

/* ── RIGHT PANEL ─────────────────────────────────────────────────────── */
.right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#map { flex: 1; min-height: 260px; }

/* ── DETAIL PANEL ────────────────────────────────────────────────────── */
.detail-panel {
  flex: 0 0 295px;
  overflow-y: auto;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
}
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-track { background: var(--surface); }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.detail-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
}

.detail-body { padding: 12px 16px; }

.detail-header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.detail-wbid {
  font-family: 'Menlo', 'SF Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.dbadge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 9.5px;
  font-weight: 600;
  white-space: nowrap;
}
.dbadge-ok    { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.dbadge-warn  { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.dbadge-error { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }

.detail-section {
  font-size: 8.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin: 10px 0 5px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 3px 8px;
}
.dk { color: var(--muted); padding: 2px 0; font-size: 10.5px; }
.dv { color: var(--sub);   padding: 2px 0; font-size: 10.5px; word-break: break-word; }
.dv .raw  { color: var(--muted); font-style: italic; }
.dv.formula { color: var(--text); font-size: 11px; }
.dv.formula strong { color: var(--green); }
.dv.mono  { font-family: 'Menlo', monospace; font-size: 9.5px; }
.raw-mono { font-family: 'Menlo', monospace; color: var(--amber); font-size: 10px; }

.detail-flags { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
.flag-ok    { color: var(--green); font-size: 10.5px; }
.flag-warn  { color: var(--amber); font-size: 10.5px; }
.flag-error { color: var(--red);   font-size: 10.5px; }
</style>
</head>
<body>

<!-- ════ HEADER ════ -->
<header>
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <div>
      <div class="logo-name">Carbon Audit Control Tower</div>
      <div class="logo-sub">GHG Protocol Scope 3 · Category 4 Upstream Transportation · FY 2024</div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">年度總碳排量</div>
      <div class="stat-main">
        <span class="stat-value" id="s-total-co2">—</span>
        <span class="stat-unit">kg CO₂e</span>
      </div>
      <div class="stat-sub" id="s-total-trips">— 趟次</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">大型貨車 (HGV)</div>
      <div class="stat-main">
        <span class="stat-value blue" id="s-hgv-co2">—</span>
        <span class="stat-unit">kg CO₂e</span>
      </div>
      <div class="stat-sub" id="s-hgv-trips">—</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">中/小型貨車 (LGV)</div>
      <div class="stat-main">
        <span class="stat-value teal" id="s-lgv-co2">—</span>
        <span class="stat-unit">kg CO₂e</span>
      </div>
      <div class="stat-sub" id="s-lgv-trips">—</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">資料品質</div>
      <div class="stat-main" style="font-size:13px;gap:6px;margin-top:2px;">
        <span style="color:var(--green)" id="s-ok">—</span> OK &nbsp;
        <span style="color:var(--amber)" id="s-warn">—</span> WARN &nbsp;
        <span style="color:var(--red)"   id="s-err">—</span> ERR
      </div>
      <div class="stat-sub" id="s-quality-pct">—</div>
    </div>
  </div>
</header>

<!-- ════ FILTER BAR ════ -->
<div class="filter-bar">
  <select id="f-vehicle" onchange="onFilter()">
    <option value="all">所有車種</option>
    <option value="large">大型貨車 (HGV)</option>
    <option value="medium">中型貨車 (LGV)</option>
    <option value="small">小型貨車 (LGV-S)</option>
    <option value="unknown">未知車種</option>
  </select>

  <select id="f-carrier" onchange="onFilter()">
    <option value="all">所有承運商</option>
  </select>

  <select id="f-quality" onchange="onFilter()">
    <option value="all">所有品質</option>
    <option value="OK">✓ OK</option>
    <option value="WARN">⚠ WARN</option>
    <option value="ERROR">✕ ERROR</option>
  </select>

  <div class="filter-sep"></div>

  <select id="f-sort" onchange="onFilter()">
    <option value="co2_desc">碳排量 高→低</option>
    <option value="co2_asc">碳排量 低→高</option>
    <option value="date">出貨日期</option>
    <option value="dist_desc">距離 遠→近</option>
  </select>

  <input type="text" id="f-search" placeholder="🔍 搜尋運單 / 路線..." oninput="onFilter()">

  <button class="btn-reset" onclick="resetFilters()">重設</button>

  <div class="count-label">
    顯示 <strong id="f-count">—</strong> / <span id="f-total">—</span> 筆
  </div>
</div>

<!-- ════ MAIN ════ -->
<main>

  <!-- LEFT: record table -->
  <div class="left-panel">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>運單 / 車種</th>
            <th>路線</th>
            <th>距離 / 載重</th>
            <th>碳排量</th>
          </tr>
        </thead>
        <tbody id="trip-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- RIGHT: map + detail -->
  <div class="right-panel">
    <div id="map"></div>
    <div class="detail-panel" id="detail-panel">
      <div class="detail-empty">← 點擊左側任一紀錄，查看完整審計軌跡</div>
    </div>
  </div>

</main>

<!-- ════ SCRIPT ════ -->
<script>
const TRIPS = __PIPELINE_DATA__;

// ── pre-compute max CO2 for bar scaling ────────────────────────────────
const MAX_CO2 = Math.max(...TRIPS.map(t => t.co2 || 0));

// ── helpers ────────────────────────────────────────────────────────────
const fmt = n => n != null ? Math.round(n).toLocaleString() : '—';
const fmtF = n => n != null ? n.toFixed(1) : '—';

// ── header stats (global, not filtered) ───────────────────────────────
function computeHeaderStats() {
  const totalCo2  = TRIPS.reduce((s, t) => s + (t.co2 || 0), 0);
  const hgv       = TRIPS.filter(t => t.vehicle === 'large');
  const lgv       = TRIPS.filter(t => t.vehicle !== 'large');
  const hgvCo2    = hgv.reduce((s, t) => s + (t.co2 || 0), 0);
  const lgvCo2    = lgv.reduce((s, t) => s + (t.co2 || 0), 0);
  const ok        = TRIPS.filter(t => t.qualityLevel === 'OK').length;
  const warn      = TRIPS.filter(t => t.qualityLevel === 'WARN').length;
  const err       = TRIPS.filter(t => t.qualityLevel === 'ERROR').length;

  document.getElementById('s-total-co2').textContent   = fmt(totalCo2);
  document.getElementById('s-total-trips').textContent = `${TRIPS.length} 趟次`;
  document.getElementById('s-hgv-co2').textContent     = fmt(hgvCo2);
  document.getElementById('s-hgv-trips').textContent   = `${hgv.length} 趟次`;
  document.getElementById('s-lgv-co2').textContent     = fmt(lgvCo2);
  document.getElementById('s-lgv-trips').textContent   = `${lgv.length} 趟次`;
  document.getElementById('s-ok').textContent          = ok;
  document.getElementById('s-warn').textContent        = warn;
  document.getElementById('s-err').textContent         = err;
  document.getElementById('s-quality-pct').textContent =
    `${((ok / TRIPS.length) * 100).toFixed(1)}% OK`;
}

// ── carrier dropdown ───────────────────────────────────────────────────
function populateCarriers() {
  const carriers = [...new Set(TRIPS.map(t => t.carrier))].sort();
  const sel = document.getElementById('f-carrier');
  carriers.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

// ── filter state ───────────────────────────────────────────────────────
let currentFiltered = [];
let selectedId = null;

const getFilters = () => ({
  vehicle: document.getElementById('f-vehicle').value,
  carrier: document.getElementById('f-carrier').value,
  quality: document.getElementById('f-quality').value,
  sort:    document.getElementById('f-sort').value,
  search:  document.getElementById('f-search').value.trim().toLowerCase(),
});

function applyFilters(trips, f) {
  return trips
    .filter(t => f.vehicle === 'all' || t.vehicle === f.vehicle)
    .filter(t => f.carrier === 'all' || t.carrier === f.carrier)
    .filter(t => f.quality === 'all' || t.qualityLevel === f.quality)
    .filter(t => {
      if (!f.search) return true;
      return t.id.toLowerCase().includes(f.search) ||
             t.origin.toLowerCase().includes(f.search) ||
             t.dest.toLowerCase().includes(f.search) ||
             t.carrier.toLowerCase().includes(f.search);
    })
    .sort((a, b) => {
      if (f.sort === 'co2_desc')  return (b.co2 || 0) - (a.co2 || 0);
      if (f.sort === 'co2_asc')   return (a.co2 || 0) - (b.co2 || 0);
      if (f.sort === 'date')      return (a.date || '').localeCompare(b.date || '');
      if (f.sort === 'dist_desc') return (b.distance || 0) - (a.distance || 0);
      return 0;
    });
}

function onFilter() {
  currentFiltered = applyFilters(TRIPS, getFilters());
  renderTable(currentFiltered);
  document.getElementById('f-count').textContent = currentFiltered.length;
}

function resetFilters() {
  ['f-vehicle','f-carrier','f-quality','f-sort'].forEach(id => {
    document.getElementById(id).selectedIndex = 0;
  });
  document.getElementById('f-search').value = '';
  onFilter();
}

// ── render table ───────────────────────────────────────────────────────
const VBADGE = {
  large:   ['vbadge-large',   'HGV'],
  medium:  ['vbadge-medium',  'LGV'],
  small:   ['vbadge-small',   'LGV-S'],
  unknown: ['vbadge-unknown', '?'],
};

function renderTable(trips) {
  const tbody = document.getElementById('trip-tbody');
  tbody.innerHTML = '';

  if (trips.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--muted)">無符合條件的紀錄</td></tr>`;
    return;
  }

  trips.forEach(trip => {
    const [vClass, vLabel] = VBADGE[trip.vehicle] || VBADGE.unknown;
    const barW = MAX_CO2 > 0 ? ((trip.co2 || 0) / MAX_CO2 * 100).toFixed(1) : 0;
    const qRow = trip.qualityLevel === 'WARN'  ? 'warn'
               : trip.qualityLevel === 'ERROR' ? 'error'
               : '';
    const qBadge = trip.qualityLevel === 'WARN'
      ? `<div><span class="qbadge qbadge-warn">⚠ WARN</span></div>`
      : trip.qualityLevel === 'ERROR'
      ? `<div><span class="qbadge qbadge-error">✕ ERR</span></div>`
      : '';

    const tr = document.createElement('tr');
    tr.className = `trip-row${qRow ? ' ' + qRow : ''}${trip.id === selectedId ? ' active' : ''}`;
    tr.dataset.id = trip.id;
    tr.innerHTML = `
      <td>
        <div class="cell-id">${trip.id}</div>
        <span class="vbadge ${vClass}">${vLabel}</span>
        ${qBadge}
        <div class="cell-date">${trip.date || '日期未知'}</div>
      </td>
      <td>
        <div class="route-from">${trip.origin}</div>
        <div class="route-arr">↓</div>
        <div class="route-to">${trip.dest}</div>
      </td>
      <td>
        <div class="dist-km">${trip.distance != null ? trip.distance + ' km' : '—'}</div>
        <div class="dist-weight">${trip.weight != null ? trip.weight + ' 噸' : '—'}</div>
      </td>
      <td>
        ${trip.co2 != null
          ? `<div class="co2-val">${fmtF(trip.co2)}</div><div class="co2-unit">kg CO₂e</div>
             <div class="co2-bar-wrap"><div class="co2-bar" style="width:${barW}%"></div></div>`
          : `<div class="co2-null">—</div><div class="co2-unit">無法計算</div>`}
      </td>
    `;
    tr.addEventListener('click', () => selectTrip(trip, tr));
    tbody.appendChild(tr);
  });
}

// ── select trip ────────────────────────────────────────────────────────
let map, activePolyline, activeMarkers = [];

function selectTrip(trip, tr) {
  document.querySelectorAll('.trip-row').forEach(r => r.classList.remove('active'));
  tr.classList.add('active');
  selectedId = trip.id;

  renderDetail(trip);
  if (map) renderRoute(trip);
}

// ── detail panel ───────────────────────────────────────────────────────
const FLAG_EXPLAIN = {
  'OK':            '<span class="flag-ok">● OK — 所有欄位格式正常</span>',
  'WARN_DATE':     '<span class="flag-warn">⚠ WARN_DATE — 日期格式非標準，ETL 已自動解析</span>',
  'WARN_WEIGHT':   '<span class="flag-warn">⚠ WARN_WEIGHT — 重量單位不明確，已依啟發式規則換算</span>',
  'WARN_VEHICLE':  '<span class="flag-warn">⚠ WARN_VEHICLE — 車種寫法非標準，已自動對應標準化</span>',
  'ERROR_NO_CO2':  '<span class="flag-error">✕ ERROR_NO_CO2 — 重量缺失，無法計算碳排量</span>',
  'ERROR_ROUTE':   '<span class="flag-error">✕ ERROR_ROUTE — 路線資料異常，無法取得距離</span>',
};

function renderDetail(trip) {
  const qBadge = {
    OK:    '<span class="dbadge dbadge-ok">✓ 審計軌跡已驗證</span>',
    WARN:  '<span class="dbadge dbadge-warn">⚠ 資料品質警告</span>',
    ERROR: '<span class="dbadge dbadge-error">✕ 資料錯誤</span>',
  }[trip.qualityLevel];

  const co2Formula = trip.co2 != null
    ? `${trip.distance} &times; ${trip.weight} &times; ${trip.ef} = <strong>${fmtF(trip.co2)}</strong> kg CO₂e`
    : '<span style="color:var(--muted)">— 缺少重量，無法計算</span>';

  const driverDistNote = trip.driverDist
    ? ` <span class="raw">（司機手填：${trip.driverDist} km — 已由 API 覆蓋）</span>`
    : '';

  const flagsHtml = trip.qualityFlags
    .map(f => FLAG_EXPLAIN[f] || `<span>${f}</span>`)
    .join('<br>');

  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-body">
      <div class="detail-header-row">
        <div class="detail-wbid">${trip.id}</div>
        ${qBadge}
      </div>

      <div class="detail-section">基本資訊</div>
      <div class="detail-grid">
        <span class="dk">出貨日期</span>
        <span class="dv">${trip.date || '—'} <em class="raw">(原始: "${trip.dateRaw || '—'}")</em></span>
        <span class="dk">承運商</span>
        <span class="dv">${trip.carrier || '—'}</span>
        <span class="dk">貨物類型</span>
        <span class="dv">${trip.goodsType || '—'}（${trip.pieces} 件）</span>
        <span class="dk">車號</span>
        <span class="dv">${trip.plate || '—'}</span>
        <span class="dk">備註</span>
        <span class="dv">${trip.note || '—'}</span>
      </div>

      <div class="detail-section">車輛資訊</div>
      <div class="detail-grid">
        <span class="dk">標準化車種</span>
        <span class="dv">${trip.vehicleLabel}</span>
        <span class="dk">原始填寫</span>
        <span class="dv raw-mono">"${trip.vehicleRaw || '—'}"</span>
      </div>

      <div class="detail-section">碳排計算過程</div>
      <div class="detail-grid">
        <span class="dk">API 距離</span>
        <span class="dv">${trip.distance != null ? trip.distance + ' km' : '—'}${driverDistNote}</span>
        <span class="dk">載重</span>
        <span class="dv">${trip.weight != null ? trip.weight + ' 噸' : '—'} <em class="raw">(原始: "${trip.weightRaw || '—'}")</em></span>
        <span class="dk">排放因子</span>
        <span class="dv">${trip.ef} kg CO₂e / tonne-km</span>
        <span class="dk">因子版本</span>
        <span class="dv">${trip.efVersion}</span>
        <span class="dk">計算式</span>
        <span class="dv formula">距離 × 載重 × EF<br>${co2Formula}</span>
      </div>

      <div class="detail-section">數位審計軌跡</div>
      <div class="detail-grid">
        <span class="dk">路線來源</span>
        <span class="dv">${trip.routeSource || '—'}</span>
        <span class="dk">API 時間戳</span>
        <span class="dv mono">${trip.apiTs || '—'}</span>
        <span class="dk">Waypoints</span>
        <span class="dv">${trip.coords ? trip.coords.length : 0} 個座標點</span>
        <span class="dk">起點地址</span>
        <span class="dv">${trip.originAddr || trip.origin}</span>
        <span class="dk">迄點地址</span>
        <span class="dv">${trip.destAddr || trip.dest}</span>
      </div>

      <div class="detail-section">資料品質旗標</div>
      <div class="detail-flags">${flagsHtml}</div>
    </div>
  `;
}

// ── Google Maps ────────────────────────────────────────────────────────
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 23.9, lng: 121.0 },
    zoom: 8,
    disableDefaultUI: false,
    mapTypeId: 'roadmap',
    styles: [
      { elementType: "geometry",           stylers: [{ color: "#1a2332" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#1a2332" }] },
      { elementType: "labels.text.fill",   stylers: [{ color: "#8a9bb0" }] },
      { featureType: "road",               elementType: "geometry",         stylers: [{ color: "#2c3e50" }] },
      { featureType: "road",               elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
      { featureType: "road.highway",       elementType: "geometry",         stylers: [{ color: "#3a5068" }] },
      { featureType: "road.highway",       elementType: "labels.text.fill", stylers: [{ color: "#b0bec5" }] },
      { featureType: "water",              elementType: "geometry",         stylers: [{ color: "#0d1f33" }] },
      { featureType: "water",              elementType: "labels.text.fill", stylers: [{ color: "#4a6fa5" }] },
      { featureType: "administrative",     elementType: "geometry.stroke",  stylers: [{ color: "#4b6a88" }] },
      { featureType: "landscape",          elementType: "geometry",         stylers: [{ color: "#1a2d3f" }] },
      { featureType: "poi",                stylers: [{ visibility: "off" }] },
      { featureType: "transit",            stylers: [{ visibility: "off" }] },
    ],
  });
}

function renderRoute(trip) {
  if (activePolyline) activePolyline.setMap(null);
  activeMarkers.forEach(m => m.setMap(null));
  activeMarkers = [];

  if (!trip.coords || trip.coords.length < 2) return;

  const path = trip.coords.map(([lat, lng]) => ({ lat, lng }));

  const color = trip.qualityLevel === 'ERROR' ? '#ef4444'
              : trip.qualityLevel === 'WARN'  ? '#f59e0b'
              : '#10b981';

  activePolyline = new google.maps.Polyline({
    path, geodesic: true,
    strokeColor: color, strokeOpacity: 0.9, strokeWeight: 5, map,
  });

  const mkr = (pos, label, fillColor) => {
    activeMarkers.push(new google.maps.Marker({
      position: pos, map,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9, fillColor, fillOpacity: 1,
        strokeColor: '#fff', strokeWeight: 2,
      },
      label: { text: label, color: '#fff', fontSize: '9px', fontWeight: 'bold' },
    }));
  };

  mkr(path[0], 'S', '#10b981');
  mkr(path[path.length - 1], 'E', '#ef4444');

  const bounds = new google.maps.LatLngBounds();
  path.forEach(p => bounds.extend(p));
  map.fitBounds(bounds, { top: 40, right: 40, bottom: 20, left: 40 });
}

// ── boot ───────────────────────────────────────────────────────────────
document.getElementById('f-total').textContent = TRIPS.length;
computeHeaderStats();
populateCarriers();
onFilter();
</script>

  src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&language=zh-TW">
