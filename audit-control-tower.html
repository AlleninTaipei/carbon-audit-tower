<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Audit Control Tower — GHG Protocol Scope 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .logo-sub  { font-size: 10px; color: #64748b; margin-top: 2px; letter-spacing: 0.3px; }

    .stats-bar { display: flex; gap: 12px; }
    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 16px;
      min-width: 130px;
    }
    .stat-label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #10b981; line-height: 1.2; }
    .stat-unit  { font-size: 9px; color: #64748b; }

    /* ── Main layout ── */
    main { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel ── */
    .left-panel {
      width: 500px;
      flex-shrink: 0;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid #334155;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .panel-header .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }

    .table-wrapper { overflow-y: auto; flex: 1; }

    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 10; }
    th {
      background: #0f172a;
      color: #64748b;
      font-weight: 500;
      padding: 8px 14px;
      text-align: left;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid #334155;
    }
    tr.trip-row {
      border-bottom: 1px solid rgba(51,65,85,0.5);
      cursor: pointer;
      transition: background 0.12s;
    }
    tr.trip-row:hover { background: rgba(30,58,95,0.6); }
    tr.trip-row.active {
      background: rgba(30,58,95,0.9);
      border-left: 3px solid #10b981;
    }
    td { padding: 10px 14px; vertical-align: top; }

    .trip-id { font-family: 'Menlo', monospace; color: #64748b; font-size: 10px; }
    .trip-date { font-size: 10px; color: #475569; margin-top: 3px; }
    .route-origin { font-size: 12px; font-weight: 600; color: #e2e8f0; }
    .route-arrow  { font-size: 10px; color: #475569; margin: 2px 0; }
    .route-dest   { font-size: 12px; color: #94a3b8; }
    .dist-km      { font-size: 12px; color: #94a3b8; }
    .dist-weight  { font-size: 10px; color: #475569; margin-top: 2px; }
    .co2-value    { font-size: 15px; font-weight: 700; color: #10b981; }
    .co2-unit     { font-size: 9px; color: #64748b; }
    .vehicle-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 4px;
    }
    .badge-large  { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .badge-medium { background: rgba(16,185,129,0.1);  color: #34d399; border: 1px solid rgba(16,185,129,0.3); }

    /* ── Right panel ── */
    .right-panel { flex: 1; display: flex; flex-direction: column; }
    #map { flex: 1; }

    /* ── Audit strip ── */
    .audit-strip {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      min-height: 42px;
    }
    .audit-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(16,185,129,0.12);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid rgba(16,185,129,0.3);
      white-space: nowrap;
    }
    .audit-badge.idle { background: rgba(71,85,105,0.3); color: #64748b; border-color: #334155; }
    .audit-item { display: flex; gap: 5px; align-items: center; }
    .audit-label { color: #64748b; white-space: nowrap; }
    .audit-value { font-family: 'Menlo', monospace; color: #94a3b8; }
  </style>
</head>
<body>

<!-- ══════════════════════════════ HEADER ══════════════════════════════ -->
<header>
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <div>
      <div class="logo-text">Carbon Audit Control Tower</div>
      <div class="logo-sub">GHG Protocol Scope 3 · Category 4 Upstream Transportation · Q1 2024</div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">總碳排量</div>
      <div><span class="stat-value" id="total-co2">—</span></div>
      <div class="stat-unit">kg CO₂e</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">資料筆數</div>
      <div><span class="stat-value" id="total-trips">—</span></div>
      <div class="stat-unit">趟次</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均每趟</div>
      <div><span class="stat-value" id="avg-co2">—</span></div>
      <div class="stat-unit">kg CO₂e / 趟</div>
    </div>
  </div>
</header>

<!-- ══════════════════════════════ MAIN ══════════════════════════════ -->
<main>

  <!-- Left: Trip table -->
  <div class="left-panel">
    <div class="panel-header">
      <div class="dot"></div>
      運輸碳排紀錄 · 點擊任一列查驗軌跡
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>運單 / 車種</th>
            <th>路線</th>
            <th>距離 / 載重</th>
            <th>碳排量</th>
          </tr>
        </thead>
        <tbody id="trip-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Right: Map + audit strip -->
  <div class="right-panel">
    <div id="map"></div>
    <div class="audit-strip" id="audit-strip">
      <div class="audit-badge idle">← 點擊左側紀錄以渲染行程路徑</div>
    </div>
  </div>

</main>

// ── Summary stats ──

document.getElementById('total-trips').textContent = TRIPS.length;
document.getElementById('avg-co2').textContent    = Math.round(totalCO2 / TRIPS.length).toLocaleString();

// ── Build table rows ──

  const tr = document.createElement('tr');
  tr.className = 'trip-row';
  tr.innerHTML = `
    <td>
      <div class="trip-id">${trip.id}</div>

    </td>
    <td>
      <div class="route-origin">${trip.origin}</div>
      <div class="route-arrow">↓</div>
      <div class="route-dest">${trip.dest}</div>
    </td>
    <td>
      <div class="dist-km">${trip.distance} km</div>
      <div class="dist-weight">${trip.weight} 噸</div>
    </td>

      <div class="co2-value">${trip.co2.toLocaleString()}</div>

    </td>
  `;
  tr.addEventListener('click', () => selectTrip(i, tr));
  tbody.appendChild(tr);
});

// ── Google Maps state ──
let map, activePolyline, activeMarkers = [];

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 23.9, lng: 120.9 },
    zoom: 8,
    disableDefaultUI: false,
    mapTypeId: 'roadmap',
    styles: [
      { elementType: "geometry",            stylers: [{ color: "#1a2332" }] },
      { elementType: "labels.text.stroke",  stylers: [{ color: "#1a2332" }] },
      { elementType: "labels.text.fill",    stylers: [{ color: "#8a9bb0" }] },
      { featureType: "road",                elementType: "geometry",          stylers: [{ color: "#2c3e50" }] },
      { featureType: "road",                elementType: "labels.text.fill",  stylers: [{ color: "#9ca5b3" }] },
      { featureType: "road.highway",        elementType: "geometry",          stylers: [{ color: "#3a5068" }] },
      { featureType: "road.highway",        elementType: "labels.text.fill",  stylers: [{ color: "#b0bec5" }] },
      { featureType: "water",               elementType: "geometry",          stylers: [{ color: "#0d1f33" }] },
      { featureType: "water",               elementType: "labels.text.fill",  stylers: [{ color: "#4a6fa5" }] },
      { featureType: "administrative",      elementType: "geometry.stroke",   stylers: [{ color: "#4b6a88" }] },
      { featureType: "landscape",           elementType: "geometry",          stylers: [{ color: "#1a2d3f" }] },
      { featureType: "poi",                 stylers: [{ visibility: "off"  }] },
      { featureType: "transit",             stylers: [{ visibility: "off"  }] }
    ]
  });
}

// ── Select trip: render polyline + update audit strip ──
function selectTrip(idx, tr) {
  document.querySelectorAll('.trip-row').forEach(r => r.classList.remove('active'));
  tr.classList.add('active');

  const trip = TRIPS[idx];

  // Clear previous overlay
  if (activePolyline) activePolyline.setMap(null);
  activeMarkers.forEach(m => m.setMap(null));
  activeMarkers = [];

  const path = trip.coords.map(([lat, lng]) => ({ lat, lng }));

  // Polyline
  activePolyline = new google.maps.Polyline({
    path,
    geodesic: true,
    strokeColor: '#10b981',
    strokeOpacity: 0.95,
    strokeWeight: 5,
    map
  });

  // Origin marker (green — S)
  activeMarkers.push(new google.maps.Marker({
    position: path[0], map,
    title: trip.origin,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 9,
      fillColor: '#10b981', fillOpacity: 1,
      strokeColor: '#ffffff', strokeWeight: 2
    },
    label: { text: 'S', color: '#fff', fontSize: '9px', fontWeight: 'bold' }
  }));

  // Destination marker (red — E)
  activeMarkers.push(new google.maps.Marker({
    position: path[path.length - 1], map,
    title: trip.dest,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 9,
      fillColor: '#ef4444', fillOpacity: 1,
      strokeColor: '#ffffff', strokeWeight: 2
    },
    label: { text: 'E', color: '#fff', fontSize: '9px', fontWeight: 'bold' }
  }));

  // Auto-fit map
  const bounds = new google.maps.LatLngBounds();
  path.forEach(p => bounds.extend(p));
  map.fitBounds(bounds, { top: 40, right: 40, bottom: 60, left: 40 });

  // Update audit trail strip
  document.getElementById('audit-strip').innerHTML = `
    <div class="audit-badge">✓ 審計軌跡已驗證</div>
    <div class="audit-item">
      <span class="audit-label">運單：</span>
      <span class="audit-value">${trip.id}</span>
    </div>
    <div class="audit-item">
      <span class="audit-label">API 回傳時間戳：</span>
      <span class="audit-value">${trip.apiTs}</span>
    </div>
    <div class="audit-item">
      <span class="audit-label">排放因子版本：</span>
      <span class="audit-value">${trip.efVersion}</span>
    </div>
    <div class="audit-item">
      <span class="audit-label">計算方法：</span>
      <span class="audit-value">Activity-based · ${trip.ef} kg CO₂e/tonne-km</span>
    </div>
    <div class="audit-item">
      <span class="audit-label">路徑點數：</span>
      <span class="audit-value">${trip.coords.length} waypoints</span>
    </div>
  `;
}
</script>
